<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星野栖所 - 开放世界种田建造</title>
    <style>
        /* ==================== 基础重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 确保Three.js canvas不会阻挡UI交互 */
        #game-container canvas {
            display: block;
        }

        /* ==================== 加载界面 ==================== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .loader {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
        }

        .loader-outer {
            border-top-color: #ffd700;
            animation: spin 2s linear infinite;
        }

        .loader-middle {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-bottom-color: #ff6b9d;
            animation: spin 1.5s linear infinite reverse;
        }

        .loader-inner {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-left-color: #87ceeb;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-stars {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .game-title {
            margin-top: 40px;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #ffd700 0%, #ff6b9d 50%, #87ceeb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .game-subtitle {
            margin-top: 12px;
            font-size: 14px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-text {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            margin-top: 15px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff6b9d);
            border-radius: 1px;
            transition: width 0.3s ease;
            animation: loadingAnimation 2s ease-in-out infinite;
        }

        @keyframes loadingAnimation {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 60%; margin-left: 20%; }
            100% { width: 0%; margin-left: 100%; }
        }

        /* ==================== HUD面板 ==================== */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: none;
            pointer-events: auto;
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hud-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(15, 15, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .hud-panel:hover {
            background: rgba(15, 15, 35, 0.75);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        #time-display {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            min-width: 80px;
            text-align: center;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Menlo', monospace;
            font-variant-numeric: tabular-nums;
        }

        .weather-icon, .season-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
        }

        .weather-icon svg, .season-icon svg {
            width: 100%;
            height: 100%;
        }

        /* FPS面板 */
        .fps-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            padding: 8px 14px;
        }

        .fps-good {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.2);
        }

        .fps-warn {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

        .fps-bad {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        /* 昼夜阶段面板 */
        .phase-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-size: 13px;
            padding: 8px 20px;
            background: rgba(15, 15, 35, 0.4);
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* ==================== 底部操作栏 ==================== */
        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(15, 15, 35, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            pointer-events: auto;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 72px;
            height: 72px;
            padding: 12px 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .action-button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .action-button:hover::before {
            opacity: 1;
        }

        .action-button:active {
            transform: translateY(-1px) scale(0.96);
            background: rgba(255, 255, 255, 0.12);
        }

        .action-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s;
        }

        .action-button:hover .action-icon {
            transform: scale(1.15);
        }

        .action-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.25s;
        }

        /* 各按钮独特颜色 */
        #action-plant:hover {
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.08);
            color: #4ade80;
        }

        #action-build:hover {
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
        }

        #action-beast:hover {
            border-color: rgba(168, 85, 247, 0.3);
            background: rgba(168, 85, 247, 0.08);
            color: #a855f7;
        }

        #action-menu:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(56, 189, 248, 0.08);
            color: #38bdf8;
        }

        /* ==================== 控制提示 ==================== */
        .controls-hint {
            position: fixed;
            bottom: 125px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 10px 24px;
            background: rgba(15, 15, 35, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s;
        }

        .controls-hint.fade-out {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
        }

        .controls-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-item .key {
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* ==================== 通知系统 ==================== */
        .notification-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            max-width: 450px;
            width: 100%;
        }

        .notification {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: notificationSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            position: relative;
        }

        @keyframes notificationSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes notificationSlideOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }

        .notification-exit {
            animation: notificationSlideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .notification-info {
            border-color: rgba(96, 165, 250, 0.3);
        }

        .notification-success {
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(15, 15, 35, 0.9);
        }

        .notification-warning {
            border-color: rgba(251, 191, 36, 0.3);
        }

        .notification-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notification-info .notification-icon {
            color: #60a5fa;
        }

        .notification-success .notification-icon {
            color: #4ade80;
        }

        .notification-warning .notification-icon {
            color: #fbbf24;
        }

        .notification-content {
            flex: 1;
            line-height: 1.4;
        }

        .notification-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            border-radius: 4px;
        }

        .notification-close:hover {
            color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* 通知进度条 */
        .notification::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            border-radius: 0 0 14px 14px;
            animation: notificationProgress 3s linear forwards;
        }

        .notification-success::after {
            background: linear-gradient(90deg, #4ade80, #22d3ee);
        }

        .notification-warning::after {
            background: linear-gradient(90deg, #fbbf24, #f97316);
        }

        @keyframes notificationProgress {
            from { width: 100%; }
            to { width: 0%; }
        }

        /* ==================== 工具提示 ==================== */
        .tooltip {
            position: fixed;
            padding: 8px 14px;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.2s, transform 0.2s;
            z-index: 600;
            max-width: 250px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .tooltip-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==================== 响应式设计 ==================== */
        @media (max-width: 768px) {
            .action-bar {
                bottom: 20px;
                padding: 10px 15px;
                gap: 8px;
            }

            .action-button {
                width: 60px;
                height: 60px;
                padding: 8px 6px;
            }

            .action-icon {
                width: 24px;
                height: 24px;
            }

            .action-label {
                font-size: 10px;
            }

            .controls-hint {
                display: none;
            }

            .hud-panel {
                padding: 8px 12px;
                font-size: 12px;
            }

            #time-display {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .action-bar {
                bottom: 15px;
                padding: 8px 12px;
                gap: 6px;
            }

            .action-button {
                width: 52px;
                height: 52px;
            }

            .hud-row {
                gap: 8px;
                flex-wrap: wrap;
            }
        }

        /* ==================== 暗色主题增强 ==================== */
        ::selection {
            background: rgba(168, 85, 247, 0.3);
            color: white;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader loader-outer"></div>
            <div class="loader loader-middle"></div>
            <div class="loader loader-inner"></div>
        </div>
        <h1 class="game-title">星野栖所</h1>
        <p class="game-subtitle">开放世界种田建造</p>
        <p class="loading-text">正在初始化世界...</p>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <!-- 游戏容器 -->
    <div id="game-container"></div>

    <!-- HUD界面 -->
    <div id="hud">
        <div class="hud-row">
            <div id="time-display" class="hud-panel">10:00:00</div>
            <div id="weather-display" class="hud-panel">
                <div class="weather-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
                <span class="weather-name" style="color: #FFD700">晴朗</span>
            </div>
            <div id="season-display" class="hud-panel">
                <div class="season-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c4-4 8-7.5 8-12a8 8 0 1 0-16 0c0 4.5 4 8 8 12z"/><path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M12 12v4"/></svg></div>
                <span class="season-name" style="color: #FFB6C1">春季</span>
            </div>
        </div>
    </div>

    <!-- 游戏主入口 -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
